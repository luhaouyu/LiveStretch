name: Build Zygisk Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download zygisk.hpp
        run: |
          curl -sL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -o jni/zygisk.hpp

      - name: Build arm64-v8a
        run: |
          mkdir -p build && cd build
          cmake ../jni \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Package KSU Module Zip
        run: |
          mkdir -p out/zygisk
          cp module/module.prop out/
          cp -r module/webroot out/
          cp build/libLiveStretch.so out/zygisk/arm64-v8a.so
          cd out && zip -r ../LiveStretch-Zygisk.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveStretch-Zygisk
          path: LiveStretch-Zygisk.zip
